tesla_model_3:
  parameters:
    # 尺寸与质量
    lF: 1.4375              # 前轴到质心距离 (m) ~ 轴距一半
    lR: 1.4375              # 后轴到质心距离 (m)
    rF: 0.79                # 前半轮距 (m) -> 总轮距 1.58 m
    rR: 0.79                # 后半轮距 (m)
    T: 1.58                 # 轮距 (m)
    m: 1760                 # 整车质量 (kg)
    h: 0.45                 # 重心高度 (m)
    g: 9.81                 # 重力加速度 (m/s²)
    Iz: 1800                # 横摆惯量 (kg·m²)
    Ix: 500             # 横滚惯量 (kg·m²)500  400 
    Iy: 1300               # 俯仰惯量 (kg·m²)1300  1100 
    Iw: 1.2                 # 单轮转动惯量 (kg·m²) ~ 估算
    wheel_radius: 0.33      # 轮胎半径 (m)

    # 非簧载质量（假设每个车轮组件质量）
    m_uf: 40                # 前单侧非簧载质量 (kg)
    m_ur: 45                # 后单侧非簧载质量 (kg)
    m_s: 1590               # 簧载质量 (kg) ≈ 总质量 - 4*非簧载

    # 轮胎 Pacejka 参数（近似值）
    B: 10                   # 刚度因子
    C: 1.9                  # 曲率因子
    D: 1.0                  # 峰值
    E: 0.97                 # 曲率调整

    # 轮胎侧偏刚度（单侧）
    C_af: 40000             # 前侧偏刚度 (N/rad)
    C_ar: 36000             # 后侧偏刚度 (N/rad)40000

    # 悬架刚度与阻尼（近似）
    K21: 15000              # 前悬架刚度 (N/m)
    C21: 1500               # 前悬架阻尼 (N·s/m)
    K23: 20000              # 后悬架刚度 (N/m)
    C23: 1500             # 后悬架阻尼 (N·s/m)

    # 轮胎竖向特性
    K1: 200000              # 轮胎竖向刚度 (N/m)
    C1: 1500                # 轮胎竖向阻尼 (N·s/m)

    # 横向稳定杆
    Kaf: 2400               # 前横向稳定杆角刚度 (N·m/rad)2000
    Kar: 1700               # 后横向稳定杆角刚度 (N·m/rad)

    # 车身角刚度/阻尼
    k_phi: 15500            # 横滚刚度 (N·m/rad)13000
    c_phi: 1200            # 横滚阻尼 (N·m·s/rad)
    k_theta: 10000          # 俯仰刚度 (N·m/rad)
    c_theta: 1800          # 俯仰阻尼 (N·m·s/rad)

    # 额外参数（占位，保持格式）
    a: 1
    b: 1
    d: 1
    m1: 50

