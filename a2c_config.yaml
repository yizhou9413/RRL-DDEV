params:
  seed: 0

  algo:
    name: a2c_basic_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: True

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0.
        fixed_sigma: True

    mlp:
      activation: elu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

    rnn:
      units: 64
      layers: 1
      name: gru
      before_mlp: True

  load_checkpoint: False
  load_path: "checkpoints"

  config:
    name: default
    full_experiment_name: default
    env_name: rlgpu

    # Basic A2C settings
    ppo: False
    learning_rate: 1.e-4
    lr_schedule: constant
    mini_epochs: 1
    clip_value: False

    # Shared training settings
    mixed_precision: True
    normalize_input: True
    normalize_value: True
    value_bootstrap: True
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    e_clip: 0.2
    entropy_coef: 0.001
    truncate_grads: True
    grad_norm: 1.0
    horizon_length: 200
    critic_coef: 2
    seq_len: 10
    bounds_loss_coef: 0.001

    max_epochs: 1000
    save_best_after: 20
    score_to_win: 20000
    save_frequency: 100
    print_stats: True

    # A2CBasicAgent safety knobs
    a2c_basic_force_constant_lr: True
    a2c_basic_auto_lr: True
    a2c_basic_learning_rate: 1.e-4
    a2c_basic_full_batch: False
    a2c_basic_target_minibatches: 8
    a2c_basic_use_stable_std: True
    a2c_basic_stable_logstd_min: -10.0
    a2c_basic_stable_logstd_max: 2.0
    a2c_basic_stable_sigma_min: 1.e-6
    a2c_basic_stable_sigma_max: 100.0
    a2c_basic_sanitize_obs: True
    a2c_basic_obs_abs_clip: 1.e4

    player:
      render: True
      games_num: 1
